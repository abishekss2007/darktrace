version: "3.8"

services:
  indexer:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    environment:
      - BASE_SEPOLIA_RPC=https://sepolia.base.org
      - HOOK_ADDRESS=0x00000000000000000000000000000000000000C0
      - ARC_RPC_URL=https://rpc.testnet.arc.network
      - SIMULATION_REGISTRY_ADDRESS=0x0000000000000000000000000000000000000000
      - ARKIV_RPC_URL=https://rpc.arkiv.network
      - DEMO_FAST=1
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    command: ["node", "dist/simulator-worker.js"]
    environment:
      - ARC_RPC_URL=https://rpc.testnet.arc.network
      - BASE_SEPOLIA_RPC=https://sepolia.base.org
    restart: unless-stopped
